<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The stored theme, before the first paint (src/lib/theme.ts keeps it up to date).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("fontmint-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <title>fontmint – customize fonts in your browser: freeze features, rename, export</title>
    <meta
      name="description"
      content="Make stylistic sets, slashed zero and other OpenType features the default, rename the family, adjust spacing, and export variable and static TTF and WOFF2 fonts. Free and open source; runs in your browser, so your fonts never leave your computer."

      content="font customization, freeze OpenType features, stylistic sets, ss01, slashed zero, rename font family, variable font to static, instance variable font, WOFF2, coding font, fontTools"
