[project]
name = "fontmint"
version = "0.1.0"
description = "Freeze OpenType features and rename fonts; export variable fonts as variable + static TTF (hinted and unhinted), OTF and WOFF2 at any axis value"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "svipas" }]
requires-python = ">=3.10"
keywords = ["fonts", "opentype", "variable-fonts", "stylistic-sets", "fonttools", "woff2"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "fonttools[woff]>=4.68",
    "opentype-feature-freezer>=1.32",
    "ttfautohint-py>=0.6",
    "skia-pathops>=0.9",
    "cffsubr>=0.4",
]

[project.urls]
Homepage = "https://github.com/svipas/fontmint"
Repository = "https://github.com/svipas/fontmint"
Issues = "https://github.com/svipas/fontmint/issues"

[project.scripts]
fontmint = "fontmint.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fontmint"]
