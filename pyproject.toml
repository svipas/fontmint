[project]
name = "fontmint"
version = "0.2.1"
description = "Make your own builds of fonts: freeze OpenType features (make stylistic sets the default), rename the family, and export variable fonts as variable and static TTF, OTF and WOFF2 at any axis value"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "svipas" }]
requires-python = ">=3.11"
keywords = ["fonts", "opentype", "variable-fonts", "stylistic-sets", "fonttools", "woff2"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "fonttools[woff]>=4.69.1",
    "ttfautohint-py>=0.6",
    "skia-pathops>=0.9",
    "cffsubr>=0.4",
]

[project.urls]
Homepage = "https://github.com/svipas/fontmint"
Repository = "https://github.com/svipas/fontmint"
Issues = "https://github.com/svipas/fontmint/issues"

[project.scripts]
fontmint = "fontmint.cli:main"

[dependency-groups]
dev = ["ruff==0.17.6", "ty==0.0.110"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
allowed-confusables = ["–", "×", "−"]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RET", "PERF", "RUF"]
ignore = [
    "SIM118", # fontTools' dict-like tables (TTFont, CharStrings) have keys() but no __iter__
]

[tool.ty.analysis]
replace-imports-with-any = ["fontTools.**"]

[tool.ty.environment]
extra-paths = ["web"] # tests/test_web.py imports fontmint_web from there
