# Every check. The release workflows run it too, so a change here affects releases.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      pages:
        description: Upload web/dist/ for GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv && .venv/bin/pip install -e .
      - run: .venv/bin/python -m unittest

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # Python builds the fontmint wheel the site serves and the test fonts.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m venv .venv && .venv/bin/pip install -e .
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: web-assets-${{ hashFiles('web/scripts/assets.ts') }}
      - run: bun run assets

      - run: bunx oxfmt --check
      - run: web/node_modules/.bin/oxfmt --check README.md AGENTS.md CHANGELOG.md docs
        working-directory: .
      - run: bun run lint --deny-warnings
      - run: bun run typecheck
      - run: bun test
      - run: bun run smoke
      - run: bun run build

      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v4
        if: inputs.pages
        with:
          path: web/dist/
