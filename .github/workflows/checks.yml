# Every check. The release workflows run it too, so a change here affects releases.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      pages:
        description: Upload web/dist/ for GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: 0.13.10
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run python -m unittest

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # uv builds the fontmint wheel the site serves, and runs Python for the test fonts.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: 0.13.10
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: .
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: web/.cache
          key: web-assets-${{ hashFiles('web/scripts/assets.ts') }}
      - run: bun run assets

      - run: bun fmt --check
        working-directory: .
      - run: bun run lint --deny-warnings
      - run: bun check
      - run: bun test
      - run: bun run smoke
      - run: bun run build

      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: inputs.pages
        with:
          path: web/dist/
